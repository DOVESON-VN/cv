:root{
  color-scheme:dark;
  --bg:#090806; --panel:rgba(16,14,11,.76); --panel-solid:#12100c; --line:rgba(255,255,255,.14); --line2:rgba(255,255,255,.07);
  --ink:#eef1f2; --muted:#949da5; --dim:#6c757c;
  /* tông vàng đen: biến vẫn tên --lime nhưng là màu vàng */
  --lime:#e0b85c; --lime-ink:#140f03; --lime-soft:rgba(224,184,92,.13);
  --gold-grad:linear-gradient(135deg,#f6dc93 0%,#d9ad4f 48%,#a9792a 100%);
  --red:#ff7262; --red-soft:rgba(255,114,98,.14); --amber:#f0c25e; --amber-soft:rgba(240,194,94,.14);
  --cbb:#e4776f; --me:#9fc0dc;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Be Vietnam Pro",-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- khung ---------- */

.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line2);background:rgba(9,8,6,.92);

/* menu ⋯ */

/* =====================================================================
   DARK LUXURY THEME – đen tuyền + vàng champagne (mobile trước, responsive desktop)
   ===================================================================== */
:root{
  --bg:#050403; --ink:#f3ede2; --muted:#a69e8f; --dim:#71695c;
  --lime:#d9c08a; --lime-ink:#15100a; --lime-soft:rgba(217,192,138,.12);
  --gold-grad:linear-gradient(135deg,#f7e9c8 0%,#dcc38b 46%,#a9874f 100%);
  --line:rgba(217,192,138,.20); --line2:rgba(217,192,138,.09);
  --panel:rgba(9,8,6,.64); --panel-solid:#0c0a08;
  --red:#ff8a7a; --amber:#e7c879;
  --r:18px; --r-sm:12px; --blur:18px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --nav-h:72px;
  --serif:"Playfair Display","Be Vietnam Pro",Georgia,serif;
}
html,body{background:#050403;color:var(--ink);-webkit-font-smoothing:antialiased}
/* nền theo trang */
#pageBg{position:fixed;inset:0;z-index:0;pointer-events:none;background:#050403;overflow:hidden}
#pageBg .lyr{position:absolute;inset:-2%;background-size:cover;background-repeat:no-repeat;opacity:0;transition:opacity .7s ease}
#pageBg .lyr.on{opacity:1}
#pageBg::after{content:"";position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(5,4,3,.40) 0%,rgba(5,4,3,.62) 32%,rgba(5,4,3,.82) 62%,rgba(5,4,3,.93) 100%),
  radial-gradient(140% 90% at 60% 20%,transparent 35%,rgba(0,0,0,.55) 100%)}
#pageBg[data-page="overview"]::after{background:
  linear-gradient(180deg,rgba(5,4,3,.30) 0%,rgba(5,4,3,.55) 38%,rgba(5,4,3,.86) 70%,rgba(5,4,3,.95) 100%),
  linear-gradient(90deg,rgba(5,4,3,.75) 0%,rgba(5,4,3,.15) 60%)}
.grain{opacity:.05;z-index:1}
.app{position:relative;z-index:2}
.content{position:relative;z-index:2}

/* chữ */
.hero h1,.page-h h1{font-family:var(--serif);font-weight:600;letter-spacing:-.005em}
.hero h1 em{font-style:italic}
.list-h h2,.prog h3,.cal h3,dialog h3,.pinbox h2,.proj h4{font-family:var(--serif);font-weight:600;letter-spacing:.005em}
.page-h p,.hero p{color:#cfc6b6}
.sec-t{color:var(--lime);letter-spacing:.16em;font-size:11.5px;font-weight:600}
.logo b{letter-spacing:.18em;font-size:16px}

/* thẻ / panel – kính đen mờ, viền champagne mảnh */
.panel,.stat,.kpi,.pinbox,.person,.bigcal .day{
  background:var(--panel)!important;border:1px solid var(--line)!important;border-radius:var(--r)!important;
  backdrop-filter:blur(var(--blur)) saturate(115%);-webkit-backdrop-filter:blur(var(--blur)) saturate(115%);
  box-shadow:0 12px 32px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,240,210,.05)}
.bigcal .day{border-radius:12px!important;box-shadow:none}
.stat:hover,.bigcal .day:hover{border-color:rgba(217,192,138,.45)!important}
.stat .h svg{color:var(--lime)}
.stat .n,.kpi b{font-family:"Be Vietnam Pro",sans-serif;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi.gold b,.hero h1 em{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* nút */
.btn-lime{background:var(--gold-grad);color:var(--lime-ink);border-radius:999px;padding:10px 18px;font-weight:600;
  box-shadow:0 6px 18px rgba(217,192,138,.18),inset 0 1px 0 rgba(255,255,255,.35)}
.btn-lime:hover{filter:brightness(1.05)}
.btn-line{border-radius:999px;border:1px solid var(--line);background:rgba(10,9,7,.55);color:var(--ink);padding:8px 14px}
.btn-line:hover{border-color:var(--lime);color:var(--lime)}
.btn-line.ok{color:var(--lime);border-color:rgba(217,192,138,.45)}
.btn-line.warn{color:var(--amber);border-color:rgba(231,200,121,.4)}
button{transition:background .2s,border-color .2s,color .2s,transform .12s,filter .2s}
button:active{transform:scale(.97)}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}

/* tab, chip, pill */
.tabs button{border-radius:999px;border:1px solid transparent;padding:8px 14px}
.tabs button.on{background:var(--lime-soft);border-color:rgba(217,192,138,.45);color:var(--lime)}
.tabs button b{background:rgba(217,192,138,.14);color:var(--lime)}
.pill{background:rgba(255,245,225,.06);border:1px solid var(--line2)}
.pill.lime .d,.pill.ok .d{background:var(--lime)}
.pill.ok{background:var(--lime-soft);color:var(--lime)}
.pr{border-radius:999px}
.tag2{border-radius:999px;background:rgba(217,192,138,.10);color:#e5d6b3}
.src.personal{color:#d9c08a} .src.cbb{color:#e8907f}

/* bảng công việc */
.thead{border-bottom-color:var(--line);color:var(--muted)}
.tr{border-bottom-color:var(--line2)}
.chk{border-color:rgba(217,192,138,.6);border-radius:6px}
.chk.on{background:var(--gold-grad);border-color:transparent}
.tname button:hover{color:var(--lime)}
.detail{background:rgba(217,192,138,.05);border:1px solid var(--line2);border-radius:var(--r-sm)}
th{color:var(--muted)} td,th{border-bottom-color:var(--line2)}

/* thanh trên + tìm kiếm */
.top{border-bottom-color:var(--line2)}
.search{border-radius:999px;background:rgba(8,7,6,.55);border-color:var(--line);backdrop-filter:blur(12px)}
.avatar{border:1px solid rgba(217,192,138,.45);background:rgba(10,9,7,.7)}
.ws-menu,.pop{background:rgba(12,10,8,.96);border-color:var(--line);border-radius:16px}

/* form */
input,select,textarea{border-radius:var(--r-sm)!important;background:rgba(5,4,3,.72)!important;border:1px solid var(--line)!important;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--lime)!important;box-shadow:0 0 0 3px rgba(217,192,138,.14)}
dialog{border-radius:22px;background:linear-gradient(180deg,#100d0a,#080706);border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(0,0,0,.66);backdrop-filter:blur(4px)}
.chk-line{border-color:var(--line)!important;border-radius:var(--r-sm)!important}
.pinbox .lockico{background:var(--lime-soft);color:var(--lime);border:1px solid var(--line)}

/* lịch */
.cgrid button.today{background:var(--gold-grad);color:var(--lime-ink)}
.cgrid .wd,.bigcal .wd{color:var(--muted)}
.bigcal .day.is-today{border-color:var(--lime)!important}
.bigcal .day.sel{background:rgba(217,192,138,.14)!important;border-color:var(--lime)!important}
.ev{border-bottom-color:var(--line2)} .ev time{color:var(--lime)}
.ev.me{background:rgba(217,192,138,.08)}

/* thanh điều hướng trái (desktop) */
.side{background:rgba(5,4,3,.78);border-right:1px solid var(--line2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.nav button{border-radius:14px;color:#d8d0c2}
.nav button.on{background:var(--lime-soft);border-color:rgba(217,192,138,.5);color:var(--lime)}
.toast{background:var(--gold-grad);color:var(--lime-ink);border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.5)}

/* ---------- MOBILE (≤900px): thanh dưới + Safe Area ---------- */
@media (max-width:900px){
  .side{padding:6px 8px calc(6px + var(--safe-b));background:rgba(5,4,3,.9);border-top:1px solid var(--line);border-right:0;
    box-shadow:0 -10px 30px rgba(0,0,0,.45)}
  .nav{gap:2px}
  .nav button{flex:1;min-width:0;min-height:54px;border-radius:14px;font-size:10px;letter-spacing:0;white-space:nowrap;padding:8px 2px}
  .nav button svg{width:22px;height:22px}
  .content{padding:var(--safe-t) 16px calc(var(--nav-h) + 28px + var(--safe-b))}
  .toast{bottom:calc(var(--nav-h) + 16px + var(--safe-b))}
  .hero{padding:36px 0 22px} .hero h1{font-size:40px;line-height:1.1}
  .page-h h1{font-size:34px}
  .stat .n{font-size:30px}
  .panel,.stat,.kpi{border-radius:16px!important}
  .btn-lime{padding:9px 14px}
  dialog{width:calc(100% - 20px);max-height:calc(100dvh - 40px - var(--safe-t) - var(--safe-b));overflow:auto}
  #pageBg .lyr{inset:0}
}
@media (min-width:901px){
  .content{padding-bottom:48px}
}
@media (prefers-reduced-motion:reduce){ #pageBg .lyr{transition:none} button{transition:none} }
</style>
</head>

/* 3 chế độ: trong Google Apps Script · trên GitHub Pages (gọi API + mã truy cập) · xem thử trên máy (dữ liệu mẫu) */
const HAS_GAS=typeof google!=='undefined'&&google.script&&google.script.run;
// Link API (bản triển khai "Bất kỳ ai"). Link này không phải bí mật: thiếu mã truy cập thì không đọc được gì.
const API_URL='https://script.google.com/macros/s/AKfycbzgAzNjkKKXF0AsDZWsVBk5WiIRT60xMFsmmB6WyXYSjfrl279IwmTtVyWOmrP9BZqefA/exec';
const ON_LOCAL=/^(localhost|127\.0\.0\.1)$/.test(location.hostname)||location.protocol==='file:';
const USE_API=!HAS_GAS&&!ON_LOCAL&&/^https:\/\/script\.google\.com\//.test(API_URL);
(function(){ // nhận mã từ link dạng ...#k=MA, lưu vào máy rồi xoá khỏi thanh địa chỉ
  const m=location.hash.match(/[#&]k=([A-Za-z0-9]{20,})/);
  if(m){ try{localStorage.setItem('cv_key',m[1])}catch(e){} history.replaceState(null,'',location.pathname+location.search); } })();
const apiKey=()=>{try{return localStorage.getItem('cv_key')||''}catch(e){return ''}};
async function call(fn,...a){
  if(HAS_GAS) return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...a));
  if(!USE_API) return new Promise((res,rej)=>setTimeout(()=>{try{res(DEMO[fn](...a))}catch(e){rej(e)}},120));
  const key=apiKey();
  if(!key){ showKeyGate(); throw new Error('Cần mã truy cập'); }
  const r=await fetch(API_URL,{method:'POST',body:JSON.stringify({key,fn,args:a})});
  const j=await r.json();
  if(!j.ok){
    if(/mã truy cập/i.test(j.error)){ try{localStorage.removeItem('cv_key')}catch(e){} showKeyGate('Mã không đúng hoặc đã bị đổi.'); }
    throw new Error(j.error);
  }
  return j.data;
}
function showKeyGate(msg){
  if(document.getElementById('keyGate')) return;
  const d=document.createElement('div'); d.id='keyGate';
  d.style.cssText='position:fixed;inset:0;z-index:100;background:rgba(9,8,6,.94);display:grid;place-items:center;padding:16px';
  d.innerHTML=`<form class="panel pinbox" style="margin:0;width:min(380px,100%)"><div class="lockico">${ico('lock',28)}</div>
    <h2>Nhập mã truy cập</h2><p>Mã chỉ lưu trên thiết bị này. Có thể đổi mã bất cứ lúc nào trong Apps Script.</p>
    ${msg?`<p class="red">${esc(msg)}</p>`:''}
    <input name="k" type="password" autocomplete="off" required placeholder="Mã truy cập" style="letter-spacing:normal;font-size:16px">
    <button class="btn-lime" style="width:100%;justify-content:center">Mở</button></form>`;
  d.querySelector('form').onsubmit=e=>{ e.preventDefault(); const v=e.target.k.value.replace(/[^a-f0-9]/gi,'').toLowerCase(); // bỏ dấu cách, ký tự ẩn khi copy
    try{localStorage.setItem('cv_key',v)}catch(_){} d.remove(); load(true); };
  document.body.appendChild(d);
}

/* ================= tiện ích ngày & dữ liệu ================= */
const toNum=s=>{const m=String(s||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);return m?(+m[3])*10000+(+m[2])*100+(+m[1]):null};
const nd=n=>new Date(Math.floor(n/10000),Math.floor(n/100)%100-1,n%100);
const dn=d=>d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
const addD=(n,k)=>{const d=nd(n);d.setDate(d.getDate()+k);return dn(d)};
const diff=(a,b)=>Math.round((nd(a)-nd(b))/864e5);
const longDate=n=>{const d=nd(n);return `${String(d.getDate()).padStart(2,'0')} Tháng ${d.getMonth()+1}, ${d.getFullYear()}`};
const money=n=>(Number(n)||0).toLocaleString('vi-VN')+'đ';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// chữ thường + link bấm được (hiện gọn: tên miền + đoạn đầu)
const linkify=s=>esc(s).replace(/https?:\/\/[^\s<]+/g,u=>{const raw=u.replace(/&amp;/g,'&');
  let label=raw.replace(/^https?:\/\/(www\.)?/,''); if(label.length>34) label=label.slice(0,32)+'…';
  return `<a href="${esc(raw)}" target="_blank" rel="noopener">${esc(label)}</a>`;});
const TODAY=()=>toNum(DATA.today);

const isDone=t=>DONE_RE.test(t.status), isCancel=t=>CANCEL_RE.test(t.status);
const evToday=()=>DATA.events.filter(e=>toNum(e.day)===TODAY());
/* ô nhập tiền: tự thêm dấu chấm 1.500.000 + gợi ý "1,5 triệu" */
const MONEY_FIELDS=['soTien','coBan','thuong','khauTru','baoGia'];
const dots=v=>String(v||'').replace(/\D/g,'').replace(/^0+(?=\d)/,'').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const words=n=>{n=+n||0; if(n>=1e9) return (n/1e9).toLocaleString('vi-VN',{maximumFractionDigits:2})+' tỷ'; if(n>=1e6) return (n/1e6).toLocaleString('vi-VN',{maximumFractionDigits:2})+' triệu'; if(n>=1e3) return (n/1e3).toLocaleString('vi-VN',{maximumFractionDigits:1})+' nghìn'; return n?n+' đ':'';};
function moneyfy(root){ root.querySelectorAll('input').forEach(i=>{ if(!MONEY_FIELDS.includes(i.name)||i.dataset.money) return;
  const max=i.getAttribute('max'); i.dataset.money='1'; if(max) i.dataset.max=max;
  i.type='text'; i.inputMode='numeric'; i.autocomplete='off'; ['min','max','step'].forEach(a=>i.removeAttribute(a));
  i.value=dots(i.value); i.placeholder=i.placeholder||'VD: 1.500.000';
  const h=document.createElement('small'); h.className='amt-hint'; i.insertAdjacentElement('afterend',h);
  const upd=()=>{h.textContent=words(i.value.replace(/\D/g,''));}; upd();
  i.addEventListener('input',()=>{const end=i.value.length-i.selectionStart; i.value=dots(i.value); const pos=Math.max(0,i.value.length-end); i.setSelectionRange(pos,pos); upd();}); }); }
function moneyVals(v,form){ MONEY_FIELDS.forEach(k=>{ if(v[k]!=null) v[k]=String(v[k]).replace(/\D/g,''); });
  form.querySelectorAll('input[data-max]').forEach(i=>{ if(+v[i.name]>+i.dataset.max) throw new Error('Tối đa '+money(+i.dataset.max)); });
  return v; }
function approval(t){ if(t.duyet==='Đã duyệt')return'approved'; if(t.duyet==='Cần sửa')return'fix';
  if(t.src==='cbb'&&isDone(t)) return'approved'; // việc công ty: DONE là hoàn thành luôn
  if(isDone(t)||REVIEW_RE.test(t.status))return'pending'; return null;}
const isOpen=t=>!isDone(t)&&!REVIEW_RE.test(t.status);
const dueN=t=>toNum(t.deadline)||toNum(t.ngayLam);
const isLate=t=>isOpen(t)&&toNum(t.deadline)&&toNum(t.deadline)<TODAY();
const prRank=p=>{const m=String(p).match(/P(\d)/i);return m?+m[1]:9};

function rows(useQ){
  const q=(useQ&&S.q||'').toLowerCase().normalize('NFC');
  const src=S.forceSrc||S.src;
  return DATA.rows.filter(t=>!isCancel(t)&&(src==='all'||t.src===src)&&
    (!q||[t.task,t.ma,t.khach,t.duAn,t.nhom,t.note,t.feedback].join(' ').toLowerCase().includes(q)));
}
function groups(list){
  const td=TODAY(), in7=addD(td,7), g={today:[],overdue:[],soon:[],nodate:[],later:[],pending:[],approved:[],fix:[],done:[]};
  list.forEach(t=>{const a=approval(t); if(a) g[a].push(t); if(isDone(t)) g.done.push(t);
    if(!isOpen(t)) return; const dl=toNum(t.deadline), nl=toNum(t.ngayLam);
    if(nl===td||dl===td) g.today.push(t); else if(dl&&dl<td) g.overdue.push(t);
    else if((dl&&dl<=in7)||(nl&&nl>td&&nl<=in7)) g.soon.push(t); else if(!dl&&!nl) g.nodate.push(t); else g.later.push(t);});
  const byDue=(a,b)=>(dueN(a)||9e7)-(dueN(b)||9e7)||prRank(a.priority)-prRank(b.priority);
  const byTime=(a,b)=>String(a.gioLam||'99').localeCompare(String(b.gioLam||'99'))||prRank(a.priority)-prRank(b.priority);
  const newest=(a,b)=>(dueN(b)||0)-(dueN(a)||0);
  g.today.sort(byTime);['overdue','soon','later'].forEach(k=>g[k].sort(byDue));['pending','fix','done'].forEach(k=>g[k].sort(newest));
  g.approved.sort((a,b)=>String(b.ngayDuyet).localeCompare(String(a.ngayDuyet))||newest(a,b));
  return g;
}
function stats(){
  const list=rows(), ym=Math.floor(TODAY()/100);
  let doing=0,pend=0,done=0;
  list.forEach(t=>{const a=approval(t);
    if(a==='approved'){const n=toNum(t.ngayDuyet)||dueN(t); if(n&&Math.floor(n/100)===ym) done++;}
    else if(a==='pending'||a==='fix') pend++;
    else if(isOpen(t)) doing++;});
  return {doing,pend,done};
}

/* ================= các khối giao diện ================= */
function statusPill(t){
  const a=approval(t);
  if(a==='approved') return `<span class="pill ok"><i class="d"></i>Hoàn thành</span>`;
  if(a==='fix') return `<span class="pill amber"><i class="d"></i>Cần sửa</span>`;
  if(a==='pending') return `<span class="pill"><i class="d"></i>Chờ duyệt</span>`;
  if(isLate(t)) return `<span class="pill red"><i class="d"></i>Quá hạn</span>`;
  if(DOING_RE.test(t.status)) return `<span class="pill lime"><i class="d"></i>Đang thực hiện</span>`;
  const n=toNum(t.ngayLam)||toNum(t.deadline);
  if(n===TODAY()) return `<span class="pill lime"><i class="d"></i>Làm hôm nay</span>`;
  return `<span class="pill"><i class="d"></i>Chờ xử lý</span>`;
}
function prPill(p){const r=prRank(p);
  if(r===1) return `<span class="pr p1"><i>↑</i>Cao</span>`; if(r===2) return `<span class="pr p2"><i>↑</i>Trung bình</span>`;
  if(r===3) return `<span class="pr p3"><i>↓</i>Thấp</span>`; return `<span class="pr p3">—</span>`;}
function linksOf(t){return [['Brief',t.briefUrl],['Source',t.sourceUrl],['Output',t.outputUrl],[t.src==='personal'?'File giao':'File / Post',t.fileUrl]].filter(x=>x[1]);}

function taskRow(t){
  const done=isDone(t)||approval(t)==='approved', dl=toNum(t.deadline), late=isLate(t);
  const sub=[`<span class="src ${t.src}">${t.src==='cbb'?'CBBS':'Cá nhân'}</span>`,
    t.ma&&esc(t.ma), t.khach&&esc(t.khach), t.duAn&&esc(t.duAn), t.nhom&&esc(t.nhom), t.gioLam&&('⏰ '+esc(t.gioLam))].filter(Boolean).join(' · ');
  const dueTxt=dl?`${ico('date',18)}${longDate(dl)}${late?` <small>(trễ ${-diff(dl,TODAY())}n)</small>`:''}`:
    (toNum(t.ngayLam)?`${ico('date',18)}Làm ${longDate(toNum(t.ngayLam))}`:'<span style="color:var(--dim)">Chưa đặt hạn</span>');
  let det='';
  if(S.open===t.id){
    const L=linksOf(t), a=approval(t), debt=(t.baoGia||0)-(t.daThu||0);
    det=`<div class="detail">
      ${t.output?`<div>Output: ${esc(t.output)}</div>`:''}

      ${t.note?`<div class="note">${linkify(t.note)}</div>`:''}

      ${t.src==='personal'&&t.baoGia?`<div class="money">💰 Báo giá ${money(t.baoGia)} · Đã thu ${money(t.daThu)}${debt>0?` · <b>Còn ${money(debt)}</b>`:' · đã thu đủ'}</div>`:''}
      ${t.duyet?`<div style="margin-top:6px;color:var(--muted)">${esc(t.duyet)} lúc ${esc(t.ngayDuyet)}</div>`:''}
      ${L.length?`<div class="row links">${L.map(([n,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener">↗ ${n}</a>`).join('')}</div>`:''}
      <div class="row">${a==='pending'||a==='fix'?`<button class="btn-line ok" data-act="approve" data-id="${t.id}" data-v="Đã duyệt">✓ Duyệt</button>`:''}
        ${a==='pending'?`<button class="btn-line warn" data-act="approve" data-id="${t.id}" data-v="Cần sửa">✎ Cần sửa</button>`:''}
        ${a==='approved'||a==='fix'?`<button class="btn-line" data-act="approve" data-id="${t.id}" data-v="">↺ Bỏ đánh dấu</button>`:''}
        ${t.src==='personal'&&debt>0?`<button class="btn-line ok" data-act="go" data-v="finance" data-f="debt">💰 Thu tiền khách</button>`:''}</div>

  }
  return `<div class="tr ${done?'done':''}">

    <div class="cells">${statusPill(t)}${prPill(t.priority)}<span class="due ${late?'late':''}">${dueTxt}</span></div>
    <button class="more" data-act="menu" data-id="${t.id}" aria-label="Thêm">···</button>
    ${det}
  </div>`;
}
const thead=`<div class="thead"><span></span><span>Công việc</span><span>Trạng thái</span><span>Độ ưu tiên</span><span>Hạn hoàn thành</span><span></span></div>`;
const table=(list,emptyTxt)=>thead+(list.length?list.map(taskRow).join(''):`<div class="empty">${emptyTxt}</div>`);

function donut(st){
  const tot=st.doing+st.pend+st.done||1, p=k=>st[k]/tot, C=2*Math.PI*58;
  const seg=(frac,off,col)=>`<circle cx="71" cy="71" r="58" fill="none" style="stroke:${col}" stroke-width="13" stroke-dasharray="${frac*C} ${C}" stroke-dashoffset="${-off*C}" transform="rotate(-90 71 71)" ${frac>0&&frac<1?'stroke-linecap="butt"':''}/>`;
  const pct=Math.round(p('done')*100);
  return `<div class="donut"><div class="ring"><svg viewBox="0 0 142 142" width="142" height="142">
    <circle cx="71" cy="71" r="58" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="13"/>
    ${seg(p('pend'),p('done')+p('doing'),'#4a5258')}${seg(p('doing'),p('done'),'#8b949a')}${seg(p('done'),0,'var(--lime)')}
    </svg><b>${pct}%</b></div>
    <div class="legend">
      <div><i style="background:var(--lime)"></i><span>Hoàn thành</span>${Math.round(p('done')*100)}%</div>
      <div><i style="background:#8b949a"></i><span>Đang thực hiện</span>${Math.round(p('doing')*100)}%</div>
      <div><i style="background:#4a5258"></i><span>Chờ xử lý</span>${Math.round(p('pend')*100)}%</div>
    </div></div>`;
}

function dayMap(list){ const m={}; list.forEach(t=>{ if(!isOpen(t)) return; const n=dueN(t); if(n)(m[n]=m[n]||[]).push(t);}); return m; }
function miniCal(){
  const td=TODAY(); if(!S.calYM) S.calYM=Math.floor(td/100);
  const y=Math.floor(S.calYM/100), m=S.calYM%100, first=new Date(y,m-1,1), days=new Date(y,m,0).getDate();
  const lead=(first.getDay()+6)%7, map=dayMap(rows());
  let cells='';
  for(let i=0;i<lead;i++) cells+=`<button class="out"></button>`;
  for(let d=1;d<=days;d++){const n=y*10000+m*100+d, has=map[n], late=has&&n<td;
    cells+=`<button data-act="day" data-n="${n}" class="${n===td?'today':''} ${S.day===n?'sel':''} ${has?'has':''} ${late?'late':''}" title="${has?has.length+' việc':''}">${d}</button>`;}
  return `<div class="cal"><div class="cal-h"><strong>Tháng ${m}, ${y}</strong><div>
    <button data-act="calPrev" aria-label="Tháng trước">‹</button><button data-act="calNext" aria-label="Tháng sau">›</button></div></div>
    <div class="cgrid">${['T2','T3','T4','T5','T6','T7','CN'].map(w=>`<div class="wd">${w}</div>`).join('')}${cells}</div></div>`;
}

/* ================= MỞ KHOÁ BẰNG VÂN TAY / FACE ID =================
   PIN được mã hoá bằng khoá AES không xuất được (lưu IndexedDB của thiết bị) và chỉ giải mã
   sau khi xác thực sinh trắc học của thiết bị (WebAuthn, platform authenticator). */
const BIO={avail:false};
const b64u=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))), unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
(async()=>{ try{ BIO.avail=!HAS_GAS&&window.isSecureContext&&!!window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); }catch(e){} if(BIO.avail&&DATA&&S.view==='finance') render(); })();
function idb(){ return new Promise((res,rej)=>{const r=indexedDB.open('cv-bio',1); r.onupgradeneeded=()=>r.result.createObjectStore('k'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);}); }
async function idbGet(k){ const db=await idb(); return new Promise((res,rej)=>{const q=db.transaction('k').objectStore('k').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error);}); }
async function idbPut(k,v){ const db=await idb(); return new Promise((res,rej)=>{const t=db.transaction('k','readwrite'); t.objectStore('k').put(v,k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error);}); }
const bioOn=()=>!!lsGet('bio_id')&&!!lsGet('bio_pin');
async function bioEnable(){
  const cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'DOVESON'},
    user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'doveson',displayName:'DOVESON'},
    pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
    authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000,attestation:'none'}});
  const key=await crypto.subtle.generateKey({name:'AES-GCM',length:256},false,['encrypt','decrypt']); await idbPut('aes',key);
  const iv=crypto.getRandomValues(new Uint8Array(12)), ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(F.pin));
  lsSet('bio_id',b64u(cred.rawId)); lsSet('bio_pin',b64u(iv)+'.'+b64u(ct));
}
async function bioUnlock(){
  await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),
    allowCredentials:[{type:'public-key',id:unb64(lsGet('bio_id'))}],userVerification:'required',timeout:60000}});
  const key=await idbGet('aes'); if(!key) throw new Error('Khoá vân tay trên máy đã mất, hãy nhập PIN rồi bật lại');
  const [iv,ct]=lsGet('bio_pin').split('.').map(unb64);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct));
}
function bioDisable(){ lsSet('bio_id',''); lsSet('bio_pin',''); }

/* ---------- Finance 2.0: trạng thái & thời gian GD ---------- */
const isConfirmed=t=>!t['Trạng thái']||t['Trạng thái']==='Đã xác nhận';
const isCountable=t=>isConfirmed(t)&&!['Chuyển nội bộ','Đơn hàng','Đảo ngược'].includes(t['Loại chi tiết']);
const txTime=t=>{const n=toNum(t['Ngày']); if(!n) return 0; const d=nd(n), m=String(t['Giờ']||'').match(/(\d{1,2}):(\d{2})/); if(m) d.setHours(+m[1],+m[2]); return d.getTime();};

function finCalc(){
  const d=F.data, ym=F.ym||Math.floor(TODAY()/100);
  // bỏ các giao dịch "Lương MM/YYYY" do bản cũ tự tạo – lương giờ được tính thẳng từ tab LUONG
  const all=d.tx.filter(t=>num(t['Số tiền'])>0&&(t['Loại']==='Thu'||t['Loại']==='Chi')
    &&!(t['Danh mục']==='Lương'&&/^Lương \d{2}\/\d{4}$/.test(String(t['Ghi chú']||''))));
  // Finance 2.0: chỉ cộng GD Đã xác nhận; bỏ Chuyển nội bộ / Đơn hàng / Đảo ngược (không phải thu chi thật)
  const tx=all.filter(isCountable);
  const pending=all.filter(t=>t['Trạng thái']==='Chờ xác nhận');
  const salAll=d.salary.filter(x=>x['Tháng']).map(x=>({ym:monthOf(x['Tháng']),got:!!x['Ngày nhận'],acc:x['Tài khoản nhận']||'Ngân hàng',
    net:num(x['Thực nhận'])||(num(x['Lương cơ bản'])+num(x['Thưởng/Phụ cấp'])-num(x['Khấu trừ']))}));
  const salOf=k=>salAll.filter(x=>x.ym===k).reduce((s,x)=>s+x.net,0);
  const inM=tx.filter(t=>monthOf(t['Ngày'])===ym);
  const sum=(l,k)=>l.filter(t=>t['Loại']===k).reduce((s,t)=>s+num(t['Số tiền']),0);
  const luong=salOf(ym), thu=sum(inM,'Thu')+luong, chi=sum(inM,'Chi');
  const acc={}; d.accounts.forEach(a=>{ if(a['Tài khoản']) acc[a['Tài khoản']]=num(a['Số dư đầu']); });
  tx.forEach(t=>{const k=t['Tài khoản']||'Tiền mặt'; acc[k]=(acc[k]||0)+(t['Loại']==='Thu'?1:-1)*num(t['Số tiền']);});
  salAll.filter(x=>x.got).forEach(x=>{acc[x.acc]=(acc[x.acc]||0)+x.net;}); // lương đã nhận vào số dư
  all.filter(t=>isConfirmed(t)&&t['Loại chi tiết']==='Chuyển nội bộ').forEach(t=>{const k=t['Tài khoản']||'Tiền mặt'; acc[k]=(acc[k]||0)+(t['Loại']==='Thu'?1:-1)*num(t['Số tiền']);});
  // số dư thật do ngân hàng báo (GD mới nhất có "Số dư sau GD")
  const bankBal={}; all.filter(t=>num(t['Số dư sau GD'])>0).sort((a,b)=>txTime(a)-txTime(b)).forEach(t=>{bankBal[t['Tài khoản']]={bal:num(t['Số dư sau GD']),at:t['Ngày']+' '+(t['Giờ']||'')};});
  const dim=new Date(Math.floor(ym/100),ym%100,0).getDate(), daily=[];
  for(let dd=1;dd<=dim;dd++){const k=ym*100+dd, l=tx.filter(t=>toNum(t['Ngày'])===k); daily.push({d:dd,thu:sum(l,'Thu'),chi:sum(l,'Chi')});}
  const total=Object.values(acc).reduce((a,b)=>a+b,0);
  const cats={}; inM.filter(t=>t['Loại']==='Chi').forEach(t=>{const k=t['Danh mục']||'Khác'; cats[k]=(cats[k]||0)+num(t['Số tiền']);});
  const budget={}; d.budget.forEach(b=>{ if(b['Danh mục']) budget[b['Danh mục']]=num(b['Hạn mức tháng']); });
  const months=[]; for(let i=5;i>=0;i--){const x=new Date(Math.floor(ym/100),ym%100-1-i,1); const k=x.getFullYear()*100+x.getMonth()+1;
    const l=tx.filter(t=>monthOf(t['Ngày'])===k); months.push({k,thu:sum(l,'Thu')+salOf(k),chi:sum(l,'Chi')});}
  const debts=d.debts.filter(x=>x['Người']).map(x=>Object.assign({},x,{con:num(x['Số tiền'])-num(x['Đã trả'])}));
  const owedMe=debts.filter(x=>x['Chiều']===d.lists.debtDirs[0]).reduce((s,x)=>s+Math.max(0,x.con),0);
  const iOwe=debts.filter(x=>x['Chiều']===d.lists.debtDirs[1]).reduce((s,x)=>s+Math.max(0,x.con),0);
  const freelance=DATA.rows.filter(t=>t.src==='personal'&&!isCancel(t)).reduce((s,t)=>s+Math.max(0,(t.baoGia||0)-(t.daThu||0)),0);
  const sal=d.salary.filter(x=>x['Tháng']).map(x=>Object.assign({},x,{ym:monthOf(x['Tháng']),net:num(x['Thực nhận'])||(num(x['Lương cơ bản'])+num(x['Thưởng/Phụ cấp'])-num(x['Khấu trừ']))}))
    .sort((a,b)=>(b.ym||0)-(a.ym||0));

const RP={per:'month',by:'src',at:''};
function rpRange(c){

function rpData(c){

document.getElementById('finForm').addEventListener('submit',async e=>{
  if(e.submitter&&e.submitter.value==='cancel') return; e.preventDefault();
  const f=e.target, k=f.dataset.kind, b=f.querySelector('.btn-lime'); b.disabled=true;
  try{
    const v=moneyVals(Object.fromEntries(new FormData(f).entries()),f);
    if(k.startsWith('tx-')) await call('addTx',F.pin,v);
    else if(k==='edittx'){ const t=F.data.tx.find(x=>x.row===+v.row);
      await call('updateTx',F.pin,Object.assign(v,{id:t['Mã GD']||'',row:+v.row,orig:{'Ngày':t['Ngày'],'Số tiền':t['Số tiền'],'Loại':t['Loại']}})); }
    else if(k==='editfix') await call('setRecurring',F.pin,{row:+v.row,ten:v.ten,action:'update',soTien:v.soTien,ngay:v.ngay,ten2:v.ten2});
    else if(k==='debt') await call('addDebt',F.pin,v);
    else if(k==='pay') await call('payDebt',F.pin,Object.assign(v,{row:+v.row}));
    else if(k==='salary') await call('addSalary',F.pin,v);
    else if(k==='recv') await call('receiveSalary',F.pin,Object.assign(v,{row:+v.row}));
    else if(k==='collect'){ const r=await call('collectClientPayment',F.pin,v); document.getElementById('fdlg').close();
      toast(`Đã thu ${money(r.paid)} · cập nhật ${r.tasks} task`); await load(true); await finLoad(); return; }
    document.getElementById('fdlg').close(); toast('Đã lưu vào sheet tài chính'); await finLoad();
  }catch(err){ toast('Lỗi: '+(err.message||err)); } finally{ b.disabled=false; }
});
document.addEventListener('submit',async e=>{
  const f=e.target; if(!f.dataset.form||!f.dataset.form.startsWith('pin')) return; e.preventDefault();
  const pin=f.pin.value;

    if(f.dataset.form==='pinNew'){ if(pin!==f.pin2.value) throw new Error('2 lần nhập PIN không khớp'); await call('setFinPin','',pin); F.status={hasPin:true}; }
    F.pin=pin; F.err=''; F.data=null; render();
  }catch(err){ F.err=err.message||String(err); render(); }
});

function toast(t){const m=document.getElementById('toast');m.textContent=t;m.classList.add('show');clearTimeout(m._t);m._t=setTimeout(()=>m.classList.remove('show'),2400);}
async function load(silent){
  try{ DATA=await call('getData'); BYID={}; DATA.rows.forEach(t=>{t.id=t.src+':'+t.row; BYID[t.id]=t;}); render(); if(!silent) toast('Đã cập nhật'); }
  catch(e){ document.getElementById('view').innerHTML=`<div class="loading">Lỗi tải dữ liệu: ${esc(e.message||e)}</div>`; }
}
async function approve(list,val){
  const stamp=new Date().toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).replace(',','');
  list.forEach(t=>{t.duyet=val;t.ngayDuyet=val?stamp:'';}); render();
  try{const n=await call('setApproval',list.map(t=>({src:t.src,row:t.row,key:t.key})),val); toast(val?`${val}: ${n} việc`:'Đã bỏ đánh dấu');}
  catch(e){toast('Lỗi ghi sheet: '+(e.message||e)); load(true);}
}
async function toggleDone(t){
  const done=isDone(t)||approval(t)==='approved';
  if(done&&t.duyet==='Đã duyệt'){ if(!confirm('Việc này đã được duyệt. Bỏ duyệt và mở lại?')) return; await approve([t],''); }
  const to=done?'TODO':'DONE';
  if(!done&&!confirm(`Đánh dấu hoàn thành: “${t.task}”?\n(Status trong sheet sẽ đổi thành DONE)`)) return;
  const old=t.status; t.status=to; render();
  try{ await call('setStatus',{src:t.src,row:t.row,key:t.key},to); toast(to==='DONE'?(t.src==='cbb'?'Đã hoàn thành':'Đã hoàn thành → chờ khách duyệt'):'Đã mở lại việc'); }
  catch(e){ t.status=old; render(); toast('Lỗi: '+(e.message||e)); }
}
function closePop(){document.querySelectorAll('.pop').forEach(p=>p.remove());}
function openMenu(t,btn){
  closePop(); const a=approval(t), r=btn.getBoundingClientRect(), p=document.createElement('div'); p.className='pop';
  p.innerHTML=linksOf(t).map(([n,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener">↗ Mở ${n}</a>`).join('')+
    (linksOf(t).length?'<hr>':'')+
    (a==='pending'||a==='fix'?`<button data-act="approve" data-id="${t.id}" data-v="Đã duyệt">✓ Duyệt</button>`:'')+
    (a==='pending'?`<button data-act="approve" data-id="${t.id}" data-v="Cần sửa">✎ Cần sửa</button>`:'')+
    (a==='approved'||a==='fix'?`<button data-act="approve" data-id="${t.id}" data-v="">↺ Bỏ đánh dấu duyệt</button>`:'')+
    `<button data-act="expand" data-id="${t.id}">Xem chi tiết</button>`+
    `<a href="${esc(t.src==='cbb'?DATA.links.cbb:DATA.links.personal)}" target="_blank">Mở trong Google Sheet ↗</a>`;
  document.body.appendChild(p);
  const w=p.offsetWidth, h=p.offsetHeight;
  p.style.left=Math.max(8,Math.min(r.right-w,innerWidth-w-8))+'px';
  p.style.top=(r.bottom+h+8>innerHeight?r.top-h-6:r.bottom+6)+'px';
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!e.target.closest('.ws')) document.getElementById('wsMenu').classList.remove('open');
  if(!el){ if(!e.target.closest('.pop')) closePop(); return; }
  const act=el.dataset.act, t=BYID[el.dataset.id];
  if(act!=='menu') closePop();
  switch(act){
    case 'go': S.view=el.dataset.v; if(el.dataset.t) S.ttab=el.dataset.t; if(el.dataset.f) F.tab=el.dataset.f; S.open=null; lsSet('view',S.view); scrollTo(0,0); render(); break;
    case 'src': S.src=el.dataset.v; lsSet('src',S.src); document.getElementById('wsMenu').classList.remove('open'); render(); break;
    case 'ttab': S.ttab=el.dataset.v; S.month=''; render(); break;
    case 'expand': S.open=S.open===el.dataset.id?null:el.dataset.id; render(); break;
    case 'menu': openMenu(t,el); break;
    case 'approve': approve([t],el.dataset.v); break;
    case 'toggle': toggleDone(t); break;
    case 'day': { const n=+el.dataset.n; if(S.view==='calendar'){S.view='overview';S.day=n;} else S.day=S.day===n?null:n; render(); break; }
    case 'calPrev': case 'calNext': { const y=Math.floor(S.calYM/100), m=S.calYM%100, d=new Date(y,m-1+(act==='calNext'?1:-1),1); S.calYM=d.getFullYear()*100+d.getMonth()+1; render(); break; }
    case 'calToday': S.calYM=Math.floor(TODAY()/100); S.calDay=null; render(); break;
    case 'cday': { const n=+el.dataset.n; S.calDay=n; S.calYM=Math.floor(n/100); S.open=null; render();
      const d=document.getElementById('dayDetail'); if(d&&innerWidth<900) d.scrollIntoView({behavior:'smooth',block:'start'}); break; }
    case 'bulk': { const l=groups(rows(true))[S.ttab].filter(x=>!S.month||x.thang===S.month); if(confirm(`Duyệt ${l.length} file?`)) approve(l,'Đã duyệt'); break; }
    case 'add': openAdd(); break;
    case 'reload': load(); break;
    case 'ftab': F.tab=el.dataset.v; render(); break;
    case 'fm': { const ym=F.ym||Math.floor(TODAY()/100), d=new Date(Math.floor(ym/100),ym%100-1+(+el.dataset.v),1); F.ym=d.getFullYear()*100+d.getMonth()+1; render(); break; }
    case 'fhide': F.hide=!F.hide; lsSet('hide',F.hide?'1':'0'); render(); break;
    case 'flock': F.pin=null; F.data=null; render(); break;
    case 'fadd': finDialog(el.dataset.v, +el.dataset.row||0, el.dataset.k); break;
    case 'deltx': { const t=F.data.tx.find(x=>x.row===+el.dataset.row); if(!t||!confirm(`Huỷ giao dịch ${t['Loại']} ${money(t['Số tiền'])} ngày ${t['Ngày']}?\n(Dòng vẫn được giữ trong sheet, khôi phục được)`)) break;
      call('deleteTx',F.pin,{id:t['Mã GD']||'',row:t.row,orig:{'Ngày':t['Ngày'],'Số tiền':t['Số tiền'],'Loại':t['Loại']}})
        .then(()=>{document.getElementById('fdlg').close(); toast('Đã huỷ giao dịch (khôi phục được)'); finLoad();}).catch(err=>toast('Lỗi: '+(err.message||err))); break; }
    case 'txact': { const id=el.dataset.id, a=el.dataset.a; if(!id){toast('Giao dịch chưa có mã, hãy tải lại'); break;}
      if(a==='void'&&!confirm('Huỷ giao dịch này? (khôi phục được)')) break;
      el.disabled=true; call('setTxStatus',F.pin,{id,action:a}).then(()=>{const dl=document.getElementById('fdlg'); if(dl.open) dl.close();
        toast({confirm:'Đã xác nhận',internal:'Đã đánh dấu chuyển nội bộ',duplicate:'Đã đánh dấu trùng',void:'Đã huỷ',restore:'Đã khôi phục'}[a]); finLoad();})
        .catch(err=>{el.disabled=false; toast('Lỗi: '+(err.message||err));}); break; }
    case 'ffreset': Object.assign(FF,{q:'',from:'',to:'',src:'',type:'',cat:'',st:'live'}); try{sessionStorage.setItem('cv_ff',JSON.stringify(FF))}catch(e){} render(); break;
    case 'csvtx': downloadCSV(`giao-dich-${dn(new Date())}.csv`,txCsv(finFiltered(finCalc()))); break;
    case 'csvrp': { const r=rpData(finCalc()); downloadCSV(`bao-cao-${r.a}-${r.b}.csv`,[['Nhóm','Số GD','Thu','Chi','Ròng'],...r.rows.map(x=>[x.k,x.n,x.thu,x.chi,x.thu-x.chi])]); break; }
    case 'csvrptx': { const r=rpData(finCalc()); downloadCSV(`giao-dich-${r.a}-${r.b}.csv`,txCsv(txSort(r.l))); break; }
    case 'devtoken': { if(F.data.device&&F.data.device.hasToken&&!confirm('Tạo mã mới? Mã cũ trên điện thoại / Gmail sẽ hết hiệu lực ngay.')) break;
      call('createDeviceToken',F.pin).then(r=>showToken(r)).catch(err=>toast('Lỗi: '+(err.message||err))); break; }
    case 'devrevoke': if(!confirm('Thu hồi mã thiết bị? Điện thoại / Gmail sẽ không gửi được dữ liệu nữa.')) break;
      call('revokeDeviceToken',F.pin).then(()=>{toast('Đã thu hồi mã'); finLoad();}).catch(err=>toast('Lỗi: '+(err.message||err))); break;
    case 'testparse': { const out=document.getElementById('tpOut'); out.innerHTML='Đang nhận diện…';

        .catch(err=>{out.innerHTML=`<p class="red">${esc(err.message||err)}</p>`;}); break; }
    case 'delfix': { const x=F.data.recurring.find(r=>r.row===+el.dataset.row); if(!x||!confirm(`Xoá khoản cố định "${x['Tên']}"? (các giao dịch đã ghi vẫn giữ)`)) break;

    case 'fixtoggle': { const x=F.data.recurring.find(r=>r.row===+el.dataset.row); if(!x) break; const on=x['Đang bật']!=='Không';

    case 'bioOn': bioEnable().then(()=>{toast('Đã bật mở khoá bằng vân tay'); render();}).catch(err=>toast('Không bật được: '+(err.message||err))); break;
    case 'bioOff': bioDisable(); toast('Đã tắt vân tay'); render(); break;
    case 'bioUnlock': bioUnlock().then(pin=>{F.pin=pin; F.err=''; F.data=null; render();}).catch(err=>{F.err=(err&&err.name==='NotAllowedError')?'Đã huỷ quét vân tay':(err.message||String(err)); render();}); break;
  }
});
